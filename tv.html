<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Closing Table — Live Standings</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#0b0d12; --surface:#14171d; --sunk:#0f1116; --ink:#f2ecd8; --ink2:#cdc4a4; --muted:#928a6c;
    --line:#2f2a1f; --gold:#d4a83c; --gold-bright:#f0d27a; --navy:#101a2e;
    --t1:#5c85d6; --t2:#d9772e; --t3:#22a68f; --t4:#d4a83c; --t5:#c95c86; --t6:#4aab5c; --t7:#8a68d9; --t8:#d1483f; --tmore:#928a6c;
    --display:"Playfair Display",Georgia,"Times New Roman",serif;
    --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1400px 900px at 0% -20%,#15233d 0%,var(--bg) 60%);color:var(--ink);
    font-family:var(--body);display:flex;flex-direction:column;min-height:100vh;padding:clamp(14px,2vw,28px);
    overflow:hidden;
  }
  h1,h2,h3{margin:0}
  .top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:clamp(12px,1.6vw,22px);padding-bottom:clamp(10px,1.2vw,16px);border-bottom:2px solid var(--gold);flex:none}
  .brand{display:flex;align-items:center;gap:clamp(10px,1.1vw,16px)}
  .mark{flex:none;width:clamp(44px,4.4vw,64px);height:clamp(44px,4.4vw,64px);border-radius:50%;background:#f6f2e7;display:grid;place-items:center;box-shadow:0 0 0 2px var(--gold)}
  .mark img{height:clamp(32px,3.2vw,47px);width:auto;display:block}
  .brand b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(22px,2.4vw,34px);line-height:1;color:var(--gold-bright)}
  .brand div span{display:block;color:var(--muted);font-size:clamp(10px,.85vw,13px);letter-spacing:.16em;text-transform:uppercase;margin-top:4px}
  .headline{text-align:right}
  .headline h1{font-family:var(--display);font-weight:700;font-size:clamp(22px,2.5vw,36px);line-height:1.1}
  .headline p{color:var(--gold);font-size:clamp(11px,.95vw,14px);margin-top:4px;letter-spacing:.04em}
  .cols{display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(14px,1.6vw,26px);flex:1;min-height:0}
  .panel{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:4px;padding:clamp(14px,1.6vw,22px);display:flex;flex-direction:column;min-height:0}
  .panel h2{font-family:var(--display);font-weight:700;font-size:clamp(16px,1.4vw,22px);color:var(--ink);margin-bottom:clamp(8px,1vw,14px);flex:none}
  .list{list-style:none;margin:0;padding:0 2px 2px 0;display:flex;flex-direction:column;gap:clamp(6px,.9vw,10px);overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;scrollbar-width:thin}
  .row{display:grid;grid-template-columns:clamp(30px,3vw,44px) clamp(10px,1vw,13px) 1fr auto;align-items:center;gap:clamp(8px,1.1vw,16px);padding:clamp(7px,.9vw,12px) clamp(10px,1.1vw,16px);background:var(--sunk);border-radius:3px;border:1px solid transparent;transition:background .4s ease}
  .row.first{border-color:rgba(212,168,60,.55);background:linear-gradient(90deg,rgba(212,168,60,.16),var(--sunk) 70%)}
  .rk{font-family:var(--display);font-weight:700;font-size:clamp(18px,1.9vw,28px);color:var(--muted);text-align:center}
  .row.first .rk{color:var(--gold)}
  .sw{width:clamp(9px,.95vw,13px);height:clamp(9px,.95vw,13px);border-radius:50%;background:var(--c)}
  .who{min-width:0}
  .who b{display:block;font-size:clamp(14px,1.3vw,19px);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who span{display:block;color:var(--muted);font-size:clamp(10.5px,.9vw,13px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .metric{text-align:right;font-variant-numeric:tabular-nums}
  .metric b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(18px,2vw,30px);line-height:1}
  .metric span{color:var(--muted);font-size:clamp(9.5px,.8vw,12px);text-transform:uppercase;letter-spacing:.06em}
  .bar{grid-column:1/-1;height:5px;background:var(--line);border-radius:1px;overflow:hidden;margin-top:2px}
  .bar i{display:block;height:100%;background:var(--c);transition:width .8s ease}
  .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:clamp(13px,1.1vw,16px)}
  .foot{margin-top:clamp(10px,1.2vw,16px);color:var(--muted);font-size:clamp(10px,.85vw,13px);text-align:center;flex:none}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:6px;vertical-align:1px;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .seg{display:none;gap:clamp(14px,1.6vw,24px);flex:none}
  .seg button{font-family:var(--body);font-weight:600;font-size:clamp(11px,.95vw,14px);color:var(--muted);background:transparent;border:0;border-bottom:2px solid transparent;padding:4px 0;cursor:pointer}
  .seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold)}
  .seg.show{display:flex}
  @media (max-width:900px){.cols{grid-template-columns:1fr;overflow-y:auto}body{overflow:auto}.top{flex-wrap:wrap}}
</style>
</head>

    <div class="seg" id="scopeSeg" role="tablist" aria-label="Leaderboard scope">
      <button type="button" role="tab" data-s="all" aria-pressed="true">All-time</button>
      <button type="button" role="tab" data-s="gamenight" aria-pressed="false">Paragon Game Night</button>
    </div>
    <div class="headline"><h1 id="headline">Loading&hellip;</h1><p id="sub"></p></div>
  </div>
  <div class="cols">
    <div class="panel">
      <h2>Team standings</h2>
      <ol class="list" id="teamlist"></ol>
    </div>
    <div class="panel">
      <h2>Top agents</h2>
      <ol class="list" id="agentlist"></ol>
    </div>
  </div>
  <div class="foot"><span class="dot"></span>Updates automatically &middot; last refreshed <span id="ts">&mdash;</span></div>

<script>
(function(){
  var API = location.origin;
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var fmtN = function(n){ return Math.round(n).toLocaleString(); };
  var teamColor = function(t){ var o = (t && t.order) || 1; return o <= 8 ? 'var(--t' + o + ')' : 'var(--tmore)'; };
  var AGENT_LIMIT = 12;
  var scope = 'all';
  var lastBoard = null;

  function scopedAgent(a, idSet){
    if(!idSet){ return a; }
    var points = 0, done = 0, last = 0;
    Object.keys(a.per || {}).forEach(function(pid){
      if(idSet.has(pid)){ points += a.per[pid]; done++; last = a.last; }
    });
    return {id:a.id, name:a.name, teamId:a.teamId, points:points, done:done, last:last};
  }

  function stats(b, sc){
    var gnIds = null;
    if(sc === 'gamenight'){ gnIds = new Set(b.puzzles.filter(function(p){ return p.gameNight; }).map(function(p){ return p.id; })); }
    var puzzles = gnIds ? b.puzzles.filter(function(p){ return gnIds.has(p.id); }) : b.puzzles;
    var open = puzzles.filter(function(p){ return p.open; });
    var maxPer = Math.max(1, open.reduce(function(a, p){ return a + p.max; }, 0));
    var agents = b.agents.map(function(a){ return scopedAgent(a, gnIds); });
    var teams = b.teams.map(function(t){
      var mem = agents.filter(function(a){ return a.teamId === t.id; }), total = 0, playing = 0;
      mem.forEach(function(a){ total += a.points; if(a.done){ playing++; } });
      var n = mem.length;
      return {t:t, n:n, total:total, playing:playing, avg:n ? total / n : 0};
    });
    var sorted = teams.slice().sort(function(a, c){ return c.avg - a.avg || c.total - a.total || a.t.order - c.t.order; });
    sorted.forEach(function(r, i){ r.rank = (i > 0 && Math.abs(sorted[i - 1].avg - r.avg) < 1e-9) ? sorted[i - 1].rank : i + 1; });
    var ag = agents.slice().sort(function(a, c){ return c.points - a.points || (a.last || 1e15) - (c.last || 1e15) || a.name.localeCompare(c.name); });
    ag.forEach(function(r, i){ r.rank = (i > 0 && ag[i - 1].points === r.points) ? ag[i - 1].rank : i + 1; });
    return {maxPer:maxPer, sorted:sorted, agents:ag, hasGameNight: b.puzzles.some(function(p){ return p.gameNight; })};
  }

  function render(b){
    lastBoard = b;
    var st = stats(b, scope);
    var seg = document.getElementById('scopeSeg');
    seg.classList.toggle('show', st.hasGameNight);
    var teamOf = function(id){ return b.teams.find(function(t){ return t.id === id; }); };
    var headline = document.getElementById('headline'), sub = document.getElementById('sub');
    var top = st.sorted.filter(function(r){ return r.rank === 1; });
    var scopeLabel = scope === 'gamenight' ? ' (Game Night)' : '';
    if(!b.teams.length){ headline.textContent = 'Not set up yet'; sub.textContent = ''; }
    else if(!top.length || top[0].avg === 0){ headline.textContent = 'No scores yet'; sub.textContent = 'Waiting for the first answers to come in'; }
    else if(top.length === 1){ headline.textContent = top[0].t.name + ' leads' + scopeLabel; sub.textContent = fmtN(top[0].avg) + ' points per agent'; }
    else { headline.textContent = top.map(function(r){ return r.t.name; }).join(' & ') + ' tied' + scopeLabel; sub.textContent = fmtN(top[0].avg) + ' points per agent'; }

    var teamlist = document.getElementById('teamlist');
    if(!st.sorted.length){ teamlist.innerHTML = '<li class="empty">No teams yet.</li>'; }
    else {
      teamlist.innerHTML = st.sorted.map(function(r){
        var pct = Math.min(100, r.avg / st.maxPer * 100);
        return '<li class="row' + (r.rank === 1 && r.avg > 0 ? ' first' : '') + '" style="--c:' + teamColor(r.t) + '">' +
          '<span class="rk">' + r.rank + '</span><span class="sw"></span>' +
          '<div class="who"><b>' + esc(r.t.name) + '</b><span>' + esc(r.t.leader || '') + ' &middot; ' + r.playing + ' of ' + r.n + ' playing</span></div>' +
          '<div class="metric"><b>' + fmtN(r.avg) + '</b><span>avg / agent</span></div>' +
          '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div></li>';
      }).join('');
    }

    var agentlist = document.getElementById('agentlist');
    var list = st.agents.slice(0, AGENT_LIMIT);
    if(!list.length){ agentlist.innerHTML = '<li class="empty">No agents yet.</li>'; }
    else {
      agentlist.innerHTML = list.map(function(a){
        var t = teamOf(a.teamId);
        return '<li class="row' + (a.rank === 1 && a.points > 0 ? ' first' : '') + '" style="--c:' + teamColor(t) + '">' +
          '<span class="rk">' + a.rank + '</span><span class="sw"></span>' +
          '<div class="who"><b>' + esc(a.name) + '</b><span>' + esc(t ? t.name : '') + '</span></div>' +
          '<div class="metric"><b>' + fmtN(a.points) + '</b><span>' + a.done + ' done</span></div></li>';
      }).join('') + (st.agents.length > AGENT_LIMIT ? '<li class="empty" style="padding:8px 0">+' + (st.agents.length - AGENT_LIMIT) + ' more agents on the full leaderboard</li>' : '');
    }
    document.getElementById('ts').textContent = new Date().toLocaleTimeString();
  }

  document.getElementById('scopeSeg').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-s]');
    if(!btn){ return; }
    scope = btn.getAttribute('data-s');
    [].slice.call(document.querySelectorAll('#scopeSeg button')).forEach(function(b){ b.setAttribute('aria-pressed', String(b === btn)); });
    if(lastBoard){ render(lastBoard); }
  });

  var etag = null;
  function poll(){
    fetch(API + '/api/state', {headers: etag ? {'If-None-Match': etag} : {}}).then(function(r){
      if(r.status === 304){ document.getElementById('ts').textContent = new Date().toLocaleTimeString(); return null; }
      etag = r.headers.get('ETag');
      return r.json();
    }).then(function(j){ if(j){ render(j); } }).catch(function(){});
  }
  poll();
  setInterval(poll, 8000);
})();
</script>
